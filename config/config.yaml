# configs/mnist_config.yaml

description: "Training a recursive CNN on various classification datasets using a DDP framework NOT pretrained."

seed: 42 # Random seed for reproducibility

# Model configuration
# Note: in_channels and num_classes will be automatically set based on the dataset
model:
  name: "RecursiveViT"  # Options: SimpleCNN, ResNet, RecursiveViT
  # in_channels: auto  # Will be set automatically based on dataset
  # num_classes: auto  # Will be set automatically based on dataset
  pretrained: false  # Whether to use pretrained weights (if applicable)
  vit_config:
    image_size: 224 # Input image size (for ViT models)
    patch_size: 16  # Patch size (for ViT models)
    dim: 384       # Embedding dimension (for ViT models)
    depth: 6       # Number of transformer layers (for ViT models)
    heads: 8       # Number of attention heads (for ViT models)
    mlp_dim: 768   # Dimension of the MLP in transformer (for ViT models) x2 the embedding dim
    dropout: 0.1   # Dropout rate (for ViT models)
    
# Dataset configuration
data:
  dataset_name: "Caltech101"  # Options: MNIST, FashionMNIST, CIFAR10, CIFAR100, SVHN, STL10, KMNIST, Caltech101, Caltech256, ImageNet
  path: "/scratch/narjis/"  # Path to download/load datasets
  val_split_size: 0.1  # 10% of training data for validation
  augmentation: true  # Whether to apply data augmentation during training
  dataloader_workers:
    train: 8
    val: 8
    test: 8
  use_precomputed_features: false
  precomputed_path: "/scratch/narjis"
# Recursion hyperparameters
recursion:
  recursive_mode: false
  N_supervision_steps:  3  # The outer loop for deep supervision (from pseudo-code) should be 1 if recursive_mode is false !!!!! is forced in the train.py to 1 if recursive_mode is false
  N_latent_steps: 2  # The 'n' in latent_recursion (zL)
  N_deep_steps: 2  # The 'T' in deep_recursion (zH)
  init_strategy: "zeros"  # "zeros" or "random": init_strategy of latent and output embeddings

# Training parameters
training:
  epochs: 300
  batch_size: 128  # Per GPU batch size
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scale_lr_by_world_size: true  # If true, effective_lr = learning_rate * world_size
  lr_scheduler_type: "cosine"  # "cosine", "step", "none"
  warmup_steps: 200
  gradient_accumulation_steps: 1  # Note: DDP + per-step .backward() means grad_accum is complex. Keeping at 1.
  early_stopping:
    enabled: true
    patience: 15
    metric: "val_accuracy"  # or "val_loss"
    mode: "max"  # "min" for loss, "max" for accuracy

# Testing (Inference) parameters
testing:
  N_supervision_steps: [1,4,8,16]  # Number of supervision steps for inference

# Distributed Data Parallel (DDP) configuration
ddp:
  backend: "nccl"  # 'nccl' for NVIDIA GPUs, 'gloo' for CPU

# Saving configuration
saving:
  base_output_dir: "./experiments"  # Base directory for all experiments
  save_only_on_rank_0: true
  best_model_name: "best_model.pth"

